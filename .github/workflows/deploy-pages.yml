name: Deploy H-CORE Aerial to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Freeze current ChatGPT-hosted site into repository
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="https://h-core-aerial-systems.karhuz.chatgpt.site"

          curl -fsSL --retry 3 "$SOURCE/" -o index.html

          # Mirror assets required by the page.
          mkdir -p assets
          curl -fsSL --retry 3 "$SOURCE/assets/h-core-aerial-logo-1a.png" -o assets/h-core-aerial-logo-1a.png
          curl -fsSL --retry 3 "$SOURCE/assets/pv-thermal-inspection.webp" -o assets/pv-thermal-inspection.webp
          curl -fsSL --retry 3 "$SOURCE/assets/wild-boars-thermal.webp" -o assets/wild-boars-thermal.webp
          curl -fsSL --retry 3 "$SOURCE/apple-touch-icon.png" -o apple-touch-icon.png

          # Apply persistent GitHub-hosted fixes after refreshing the source snapshot.
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          html = p.read_text(encoding="utf-8")

          mobile_tag = '  <link rel="stylesheet" href="mobile-fix.css?v=5" />\n'
          if "mobile-fix.css" not in html:
              html = html.replace("</head>", mobile_tag + "</head>", 1)
          else:
              html = re.sub(r'<link rel="stylesheet" href="mobile-fix\.css\?v=\d+"\s*/?>', '<link rel="stylesheet" href="mobile-fix.css?v=5" />', html, count=1)

          # Clicking the brand should simply return to the page root. Using #top
          # caused a noticeable anchor jump on mobile and made the sticky header
          # look as if it was hiding/collapsing.
          html = html.replace('<a class="brand" href="#top"', '<a class="brand" href="/"', 1)

          # Render the wildlife thermal photo as a real IMG instead of relying only
          # on background-image. This is more reliable on mobile browsers.
          thermal_open = '<div class="thermal">'
          thermal_img = '<div class="thermal"><img class="thermal-photo" src="assets/wild-boars-thermal.webp?v=2" alt="Termowizyjny obraz dzików z drona" loading="lazy" decoding="async">'
          if 'class="thermal-photo"' not in html:
              html = html.replace(thermal_open, thermal_img, 1)

          thermal_style = '''\n  <style id="thermal-photo-fix">\n    .thermal{background:#090D10 !important}\n    .thermal-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:0}\n  </style>\n'''
          if 'id="thermal-photo-fix"' not in html:
              html = html.replace("</head>", thermal_style + "</head>", 1)

          # Keep the responsive section navigation in every refreshed snapshot.
          nav_markup = "  <nav class=\"nav\" aria-label=\"Główna nawigacja\">\n    <div class=\"wrap nav-inner\">\n      <a class=\"brand\" href=\"/\" aria-label=\"H-CORE AERIAL SYSTEMS — strona główna\">\n        <img class=\"brand-logo\" src=\"assets/h-core-aerial-logo-1a.png\" alt=\"H-CORE AERIAL SYSTEMS\" width=\"1959\" height=\"803\" fetchpriority=\"high\">\n      </a>\n      <div class=\"nav-links\" aria-label=\"Sekcje strony\">\n        <a href=\"#uslugi\">Usługi</a><a href=\"#wildlife\">Poszukiwania</a><a href=\"#proces\">Przebieg</a><a href=\"#system\">System</a>\n      </div>\n      <div class=\"nav-actions\">\n        <button class=\"nav-toggle\" type=\"button\" aria-expanded=\"false\" aria-controls=\"nav-panel\" aria-label=\"Otwórz menu\">\n          <span class=\"nav-toggle-label\">Menu</span><span class=\"nav-toggle-icon\" aria-hidden=\"true\"></span>\n        </button>\n        <a class=\"nav-cta\" href=\"#kontakt\">Zgłoś zlecenie</a>\n      </div>\n    </div>\n    <div class=\"nav-panel\" id=\"nav-panel\" hidden>\n      <div class=\"wrap nav-panel-inner\">\n        <a href=\"#uslugi\"><span>01</span>Usługi</a>\n        <a href=\"#wildlife\"><span>02</span>Poszukiwania</a>\n        <a href=\"#proces\"><span>03</span>Przebieg</a>\n        <a href=\"#system\"><span>04</span>System</a>\n      </div>\n    </div>\n  </nav>"
          html = re.sub(r'  <nav class="nav">.*?</nav>', nav_markup, html, count=1, flags=re.S)

          process_open = "<section class=\"section\">\n      <div class=\"wrap\">\n        <div class=\"section-top\"><div class=\"section-index\">04 / PRZEBIEG ZLECENIA"
          process_with_id = "<section class=\"section\" id=\"proces\">\n      <div class=\"wrap\">\n        <div class=\"section-top\"><div class=\"section-index\">04 / PRZEBIEG ZLECENIA"
          html = html.replace(process_open, process_with_id, 1)
          html = html.replace('Wielosensorowa. Gotowa do działania.', 'Platforma wielosensorowa. Gotowa do działania.', 1)

          navigation_style = "\n  <style id=\"navigation-fix\">\n    .nav-links{display:flex;align-items:center;gap:24px}\n    .nav-links a{position:relative;padding:10px 0}\n    .nav-links a:after{content:\"\";position:absolute;left:0;right:100%;bottom:0;height:2px;background:var(--red);transition:right .18s ease}\n    .nav-links a:hover:after,.nav-links a[aria-current=\"page\"]:after{right:0}\n    .nav-actions{display:flex;align-items:center;gap:10px;flex:0 0 auto}\n    .nav-toggle{display:none;align-items:center;justify-content:center;gap:9px;height:38px;padding:0 12px;border:1px solid #0A0D10;background:transparent;color:#0A0D10;font:700 10px/1 \"Courier New\",monospace;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}\n    .nav-toggle:hover,.nav-toggle[aria-expanded=\"true\"]{color:#F2F1ED;background:#0A0D10}\n    .nav-toggle-icon,.nav-toggle-icon:before,.nav-toggle-icon:after{display:block;width:14px;height:2px;background:currentColor;transition:transform .18s ease}\n    .nav-toggle-icon{position:relative}.nav-toggle-icon:before,.nav-toggle-icon:after{content:\"\";position:absolute;left:0}\n    .nav-toggle-icon:before{top:-5px}.nav-toggle-icon:after{top:5px}\n    .nav-toggle[aria-expanded=\"true\"] .nav-toggle-icon{background:transparent}\n    .nav-toggle[aria-expanded=\"true\"] .nav-toggle-icon:before{top:0;transform:rotate(45deg)}\n    .nav-toggle[aria-expanded=\"true\"] .nav-toggle-icon:after{top:0;transform:rotate(-45deg)}\n    .nav-panel{position:absolute;left:0;right:0;top:100%;background:#090D10;color:#F1F3F4;border-top:2px solid var(--red);box-shadow:0 18px 42px rgba(0,0,0,.28)}\n    .nav-panel[hidden]{display:none}.nav-panel-inner{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}\n    .nav-panel a{display:flex;align-items:center;gap:13px;padding:18px 0;border-bottom:1px solid var(--line);font:700 11px/1 \"Courier New\",monospace;letter-spacing:.13em;text-transform:uppercase}\n    .nav-panel a:nth-child(odd){padding-right:24px}.nav-panel a:nth-child(even){padding-left:24px}\n    .nav-panel a span{color:var(--red);font-size:9px}.nav-panel a:hover{color:var(--red)}\n    @media(max-width:900px){.nav-links{display:none}.nav-toggle{display:inline-flex}}\n    @media(max-width:620px){.nav-actions{gap:6px}.nav-toggle{width:34px;padding:0}.nav-toggle-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}.nav-panel-inner{grid-template-columns:1fr}.nav-panel a,.nav-panel a:nth-child(odd),.nav-panel a:nth-child(even){padding:15px 0}.nav-panel a:last-child{border-bottom:0}}\n  </style>\n"
          if 'id="navigation-fix"' not in html:
              html = html.replace("</head>", navigation_style + "</head>", 1)

          navigation_script = "\n  <script>\n    (function(){\n      var nav=document.querySelector('.nav'),toggle=document.querySelector('.nav-toggle'),panel=document.getElementById('nav-panel');\n      if(!nav||!toggle||!panel)return;\n      var links=Array.prototype.slice.call(nav.querySelectorAll('a[href^=\"#\"]'));\n      var sectionLinks=links.filter(function(link){return link.getAttribute('href')!=='#kontakt'});\n      var sections=sectionLinks.map(function(link){return document.querySelector(link.getAttribute('href'));}).filter(Boolean);\n      function closeMenu(){toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-label','Otwórz menu');panel.hidden=true;}\n      toggle.addEventListener('click',function(){var open=toggle.getAttribute('aria-expanded')==='true';toggle.setAttribute('aria-expanded',String(!open));toggle.setAttribute('aria-label',open?'Otwórz menu':'Zamknij menu');panel.hidden=open;});\n      panel.addEventListener('click',function(event){if(event.target.closest('a'))closeMenu();});\n      document.addEventListener('keydown',function(event){if(event.key==='Escape')closeMenu();});\n      document.addEventListener('click',function(event){if(!nav.contains(event.target))closeMenu();});\n      window.addEventListener('resize',function(){if(window.innerWidth>900)closeMenu();});\n      function updateCurrent(){var marker=window.scrollY+Math.max(130,window.innerHeight*.24),current='';sections.forEach(function(section){if(section.offsetTop<=marker)current=section.id;});sectionLinks.forEach(function(link){if(link.getAttribute('href')==='#'+current)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current');});}\n      window.addEventListener('scroll',updateCurrent,{passive:true});window.addEventListener('resize',updateCurrent);updateCurrent();\n    })();\n  </script>\n"
          if 'function closeMenu' not in html:
              html = html.replace("</body>", navigation_script + "</body>", 1)

          p.write_text(html, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mobile-fix.css assets apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "Refresh H-CORE Aerial snapshot and mobile assets"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
