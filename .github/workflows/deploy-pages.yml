name: Deploy H-CORE Aerial to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Freeze current ChatGPT-hosted site into repository
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="https://h-core-aerial-systems.karhuz.chatgpt.site"

          curl -fsSL --retry 3 "$SOURCE/" -o index.html

          # The source snapshot contains relative asset URLs. Mirror the assets
          # required by the page so GitHub Pages does not render broken images.
          mkdir -p assets
          curl -fsSL --retry 3 "$SOURCE/assets/h-core-aerial-logo-1a.png" -o assets/h-core-aerial-logo-1a.png
          curl -fsSL --retry 3 "$SOURCE/assets/pv-thermal-inspection.webp" -o assets/pv-thermal-inspection.webp
          curl -fsSL --retry 3 "$SOURCE/assets/wild-boars-thermal.webp" -o assets/wild-boars-thermal.webp
          curl -fsSL --retry 3 "$SOURCE/apple-touch-icon.png" -o apple-touch-icon.png

          # Keep mobile fixes separate from the imported snapshot and inject
          # the stylesheet on every refresh of index.html.
          python3 - <<'PY'
          from pathlib import Path

          p = Path("index.html")
          html = p.read_text(encoding="utf-8")
          tag = '  <link rel="stylesheet" href="mobile-fix.css?v=3" />\n'
          if "mobile-fix.css" not in html:
              html = html.replace("</head>", tag + "</head>", 1)
          p.write_text(html, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mobile-fix.css assets apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "Refresh H-CORE Aerial snapshot and mobile assets"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
